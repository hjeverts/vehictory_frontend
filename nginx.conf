server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # De API accepteert onderhoudsbijlagen (PDF-facturen) tot 10 MB; reserveer
    # ruimte voor de multipart/form-data-overhead zodat Nginx die uploads doorstuurt.
    client_max_body_size 12m;

    # Angular client-side routing: onbekende paden terugvallen op index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API-requests doorsturen naar de .NET-backend (compose service naam: api)
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
